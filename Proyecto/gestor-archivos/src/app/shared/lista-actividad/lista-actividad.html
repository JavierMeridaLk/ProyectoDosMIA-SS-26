<ol class="lista">
  @for (r of registros(); track r._id) {
    <li class="fila">
      <span class="icono"><app-icono [nombre]="icono(r)" [tamano]="18" /></span>
      <div class="datos">
        <p>
          <strong>{{ r.usuarioNombre }}{{ r.propio ? ' (tú)' : '' }}</strong>
          {{ textoAccion(r) }}
          @if (muestraRecurso(r)) {
            <strong>«{{ r.recurso.nombre }}»</strong>
          }
        </p>
        @if (r.detalle) {
          <small class="detalle">{{ r.detalle }}</small>
        }
      </div>
      <time [attr.datetime]="r.fecha">{{ r.fecha | date: 'dd/MM/yyyy HH:mm' }}</time>
    </li>
  }
</ol>
